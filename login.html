<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    
    <!-- 1. The script file that fetches Google's login core library -->
    <script src="https://google.com" defer></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1.5px, transparent 1.5px), linear-gradient(#031757, #033157);
            background-size: 24px 24px, auto;
            background-attachment: fixed; 
            min-height: 100vh; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .maint {
            font-size: 128px;
            color: #ffffff;
            -webkit-text-stroke: 2px #000000;
            text-shadow: 15px 15px 30px rgba(0, 0, 0, 0.85);
            margin: 0; 
            line-height: 1.1; 
        }
        .subt {
            font-size: 96px;
            color: #c9c7c7; 
            margin: 0;
            line-height: 1.1;
            margin-top: 20px; 
            margin-bottom: 40px; /* Space above button */
        }
        #google-login-button {
            display: block;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <h1 class="maint">The One And Only</h1>
    <p class="subt">Advanced Game Site</p>

    <!-- 2. The exact element target Google searches for -->
    <div id="google-login-button"></div>

    <!-- 3. The functional initialization script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Wait for Google's library to finish loading over the network
            const checkGoogle = setInterval(function() {
                if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                    clearInterval(checkGoogle);
                    initializeLogin();
                }
            }, 100);
        });

        function initializeLogin() {
            google.accounts.id.initialize({
                client_id: "94703011846-3g14p59ln5h0gepumoq4ei1b8chlr3qn.apps.googleusercontent.com", // <-- Put your real numeric client ID here
                callback: handleCredentialResponse
            });

            google.accounts.id.renderButton(
                document.getElementById("google-login-button"),
                { theme: "dark", size: "large", type: "standard", shape: "pill" }
            );
        }

        function handleCredentialResponse(response) {
            alert("Login Successful!");
            console.log("Encoded JWT ID Token: " + response.credential);
        }
    </script>
</body>
</html>
