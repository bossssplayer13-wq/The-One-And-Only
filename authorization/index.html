<!DOCTYPE html>
<html>
<head>
    <title>New Tab</title>
    <!-- Keep the Google API script in your head -->
    <script src="https://google.com" async defer></script>
    
    <!-- Link your separate script file before the closing head tag -->
    <script src="auth.js" defer></script>
</head>
<body>

    <!-- This remains exactly the same in your HTML layout -->
    <div id="auth-container">
        <div id="google-login-button"></div>
    </div>

</body>
</html>
