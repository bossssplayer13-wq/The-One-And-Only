<!DOCTYPE html>
<html>
<head>
    <title>New Tab</title>
    <link rel="icon" type="image/svg+xml" href="https://jsdelivr.net">
    <style>
        body {
            background-color: #f0f4f8; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #c9c7c7; 
            padding: 40px;
            text-align: center;
        }
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            background-image: linear-gradient(#031757, #033157);
            background-attachment: fixed; 
            min-height: 100vh; 
        }
        .card {
            background-image: linear-gradient(45deg, #031757, #033157);
        }
        body {
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.15) 2px, transparent 2px), 
                linear-gradient(#031757, #033157);
            
            background-size: 24px 24px, auto;
            
            background-attachment: fixed; 
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        <img src="assets/logomain.png" alt="Main Logo" class="logom">
       .logom {
            position: fixed;
            top: 20px;
            left: 20px;
            
            width: 80px;
            height: auto;
            z-index: 100;           
        }
    </style>
</head>
<body>
    <h1 class="maint">The One And Only</h1>
    <p class="subt">Advanced Game Site</p>
    <style>
        .subt {
            font-size: 48px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            -webkit-text-stroke: 2px #000000;
            background-image: linear-gradient(#ffe259, #ffa751);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 3px;
        }
        .maint {
            font-size: 72px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            -webkit-text-stroke: 2px #000000;
            background-image: linear-gradient(#00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
</body>
</html>
